<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booth Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Booth Manager</h1>

  <form id="boothForm">
    <input type="text" id="booth" name="booth" placeholder="Booth" required />
    <select id="boothType" name="boothType" required>
      <option value="">Pilih Booth Type</option>
      <option value="Rutin">Rutin</option>
      <option value="Paylater">Paylater</option>
      <option value="Lain-lain">Lain-lain</option>
    </select>
    <input type="text" id="boothSize" name="boothSize" placeholder="Booth Size" required />
    <input type="text" id="eventName" name="eventName" placeholder="Event Name" required />
    <input type="date" id="startDate" name="startDate" required />
    <input type="date" id="endDate" name="endDate" required />
    <input type="number" id="cost" name="cost" placeholder="Cost (Rp)" required />
    <input type="number" id="budget" name="budget" placeholder="Budget (Rp)" />
    <input type="number" id="otherExpenses" name="otherExpenses" placeholder="Other Expenses (Rp)" />
    <input type="text" id="backdropSize" name="backdropSize" placeholder="Backdrop Size" />
    <input type="number" id="backdropCost" name="backdropCost" placeholder="Backdrop Cost (Rp)" />
    <input type="text" id="contact" name="contact" placeholder="Contact" />
    <textarea id="description" name="description" placeholder="Description"></textarea>
    <button type="submit">Save Booth</button>
  </form>

  <hr />

  <label for="eventFilter">Filter by Event:</label>
  <select id="eventFilter">
    <option value="">Semua Event</option>
  </select>

  <table>
    <thead>
      <tr>
        <th>Booth</th>
        <th>Type</th>
        <th>Size</th>
        <th>Event</th>
        <th>Start</th>
        <th>End</th>
        <th>Cost</th>
        <th>Budget</th>
        <th>Other</th>
        <th>Backdrop Size</th>
        <th>Backdrop Cost</th>
        <th>Contact</th>
        <th>Description</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="boothTable"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
